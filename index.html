<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بوابة رمضان 1447هـ - 2026</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="description" content="تطبيق بوابة رمضان يعمل بدون إنترنت">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Arabic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#fbbf24;
      --bg:#020617;
      --glass: rgba(30,41,59,.68);
      --glass2: rgba(15,23,42,.55);
      --stroke: rgba(251,191,36,.18);
    }
    body{
      font-family:'Cairo',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(251,191,36,.14), transparent 55%),
                  radial-gradient(900px 450px at 20% 10%, rgba(16,185,129,.10), transparent 55%),
                  radial-gradient(900px 450px at 80% 30%, rgba(59,130,246,.08), transparent 55%),
                  var(--bg);
      color:#f8fafc;
      margin:0;
      overflow-x:hidden;
    }

    .islamic-bg{
      background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fbbf24' fill-opacity='0.07'%3E%3Cpath d='M40 4l4 16 16 4-16 4-4 16-4-16-16-4 16-4z'/%3E%3Cpath d='M12 40l3 12 12 3-12 3-3 12-3-12-12-3 12-3z'/%3E%3Cpath d='M68 40l3 12 12 3-12 3-3 12-3-12-12-3 12-3z'/%3E%3C/g%3E%3C/svg%3E");
    }

    .glass-card{
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      backdrop-filter: blur(12px);
      border:1px solid var(--stroke);
      border-radius: 1.5rem;
      box-shadow: 0 30px 60px rgba(0,0,0,.35);
    }

    .moon-glow{ filter: drop-shadow(0 0 18px rgba(251,191,36,.55)); }

    .active-tab{
      color: var(--gold);
      border-bottom: 3px solid var(--gold);
    }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .pulse-light{ animation:pulse 2s infinite; }

    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .floaty{ animation: floaty 4s ease-in-out infinite; }

    .chip{
      background: rgba(148,163,184,.12);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 999px;
    }

    .soft-divider{ border-top: 1px dashed rgba(251,191,36,.22); }

    .fade-in{ animation: fade .25s ease-out; }
    @keyframes fade{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }

    :focus-visible{ outline: 3px solid rgba(251,191,36,.45); outline-offset: 3px; border-radius: 10px; }
  </style>
</head>

<body class="islamic-bg min-h-screen">
  <div class="max-w-md mx-auto px-4 py-8">

    <header class="text-center mb-10">
      <div class="inline-flex items-center justify-center mb-4 floaty" aria-hidden="true">
        <svg width="92" height="92" viewBox="0 0 100 100" class="moon-glow">
          <path d="M50 10 A40 40 0 1 0 90 50 A30 30 0 1 1 50 10" fill="#fbbf24" />
        </svg>
      </div>

      <h1 class="text-4xl font-bold font-['Amiri'] text-yellow-500 mb-2">
        بوابة رمضان 1447هـ
      </h1>

      <!-- التاريخ الميلادي هنا فقط (جنب المدينة) -->
      <div class="flex flex-wrap gap-2 justify-center items-center text-[12px] text-slate-300">
        <span class="chip px-3 py-1">2026</span>
        <span class="chip px-3 py-1" id="city-chip">الخرطوم</span>
        <span class="chip px-3 py-1" id="today-chip">—</span>
      </div>

      <p id="ramadan-status" class="mt-3 text-sm text-emerald-400 font-bold pulse-light">
        جاري الحساب...
      </p>

      <!-- الساعة + الهجري فقط (بدون ميلادي لتفادي التكرار) -->
      <div class="mt-4 text-center">
        <div id="live-clock" class="text-2xl font-bold text-yellow-400"></div>
        <div id="hijri-date" class="text-xs text-slate-400 mt-1"></div>
      </div>
    </header>

    <nav class="flex justify-around mb-8 border-b border-slate-700/70" role="tablist" aria-label="التنقل">
      <button role="tab" aria-selected="true" aria-controls="content-home" id="tab-home"
        class="pb-3 px-2 active-tab font-bold transition-all">
        الرئيسية
      </button>
      <button role="tab" aria-selected="false" aria-controls="content-tasbeeh" id="tab-tasbeeh"
        class="pb-3 px-2 text-slate-400 font-bold transition-all">
        المسبحة
      </button>
      <button role="tab" aria-selected="false" aria-controls="content-card" id="tab-card"
        class="pb-3 px-2 text-slate-400 font-bold transition-all">
        تهنئة
      </button>
    </nav>

    <section id="content-home" class="space-y-6 fade-in" role="tabpanel" aria-labelledby="tab-home">
      <div
